<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    
    <section class="hero">
      <div class="herobg">
        <header>
          <div class="nav">
            <nav>
              <div class="logo">
                <img src="images/logo.png" alt="Netflix Logo" />
              </div>
              <div class="menu">
                <div class="dropbox1">
                  <button class="btn btn1" id="lang1">Language &#9660;</button>
                  <div class="lang-menu">
                    <button
                      class="btn lang-btn"
                      onclick="changeLang('English')"
                    >
                      English
                    </button>
                    <button class="btn lang-btn" onclick="changeLang('Hindi')">
                      Hindi
                    </button>
                  </div>
                </div>
                <button class="btn btn2 btnhover">Sign In</button>
              </div>
            </nav>
          </div>
        </header>

        <div class="hero-content">
          <h1>Unlimited movies, shows, and more</h1>
          <p>Starts at ₹149. Cancel at any time.</p>

          <p class="mt">Ready to watch? Enter your email to create or restart your membership.</p>
          <form action="#" method="post">
                    <div class="heroButton">

                    <input type="email" placeholder="Email Address" required >
                    <button type="submit" class="btn btnhover">Get Started &gt;</button>
                </div>
            </form>
        </div>
      </div>
    </section>




    <main>
        <section class="sec1">
            
        </section>
    </main>

    <footer>
        
    </footer>




    <script>
      function changeLang(language) {
        document.getElementById("lang1").innerText = language;
      }
    </script>
  </body>
</html>
